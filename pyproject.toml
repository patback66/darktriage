[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "darktriage"
version = "0.1.0"
description = "Terminal-native pre-import triage & darktable-cli automation engine"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "darktriage", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
opencv-python = "^4.8.0"
numpy = "^1.24.0"
pillow = "^10.0.0"
rich = "^13.0.0"
textual = "^0.40.0"

[tool.poetry.scripts]
darktriage = "darktriage.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
